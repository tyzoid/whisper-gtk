[package]
name = "whisper-gtk"
version = "0.1.0"
edition = "2021"
description = "GTK4 push-to-talk desktop dictation using whisper.cpp"
repository = "https://github.com/tyzoid/whisper-gtk"
license = "GPL-3.0-only"
exclude = [
    "Cargo.toml.orig",
    "target/",
    "releng/arch/pkg/",
    "releng/arch/src/",
    "releng/arch/*.pkg.tar.zst",
    "releng/arch/*.pkg.tar.zst.sig",
]

[dependencies]
gtk = { package = "gtk4", version = "0.10.3" }
glib = "0.21.5"
libxdo = "0.6"
pulse = { version = "2.0", package = "libpulse-binding" }
psimple = { version = "2.0", package = "libpulse-simple-binding" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
whisper-rs = "0.16.0"
